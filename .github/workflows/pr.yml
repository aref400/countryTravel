name: PR Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Lint Front
        run: npm run lint --workspace=apps/front

      - name: Build Front
        run: npm run build --workspace=apps/front
