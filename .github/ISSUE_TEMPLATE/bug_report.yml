name: "Rapport de bogue"
description: "Consigner une anomalie détectée en production ou en recette"
title: "[BUG] <résumé court>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de consigner l'anomalie de façon à ce qu'elle soit **reproductible**.
        Les informations ci-dessous alimentent le [plan de correction des bogues](../../docs/plan-correction-bogues.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? En une à deux phrases.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      description: La suite d'actions exacte permettant de reproduire le bogue.
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Rafraîchir la page
        4. Observer l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Message d'erreur, capture d'écran, extrait de log si disponible.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Gravité
      options:
        - "🔴 Bloquant — empêche l'usage normal"
        - "🟠 Majeur — fonctionnalité dégradée mais contournable"
        - "🟡 Mineur — impact limité (UX, cas rare)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Périmètre concerné
      options:
        - "Front (React)"
        - "API (NestJS)"
        - "Base de données"
        - "CI/CD"
        - "Inconnu"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Navigateur / OS / version, et environnement (production, local).
      placeholder: "Ex. : Chrome 127 / Windows 11 — production (Netlify)"
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source de détection
      description: Recette, retour utilisateur, échec CI, monitoring…
    validations:
      required: false
